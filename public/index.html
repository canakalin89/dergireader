<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Dergi Kütüphanesi — Aziz Sancar Anadolu Lisesi</title>
  <meta name="description" content="Aziz Sancar Anadolu Lisesi dijital dergi arşivi" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-brand">
      <img src="/img/logo.png" alt="Aziz Sancar Anadolu Lisesi Logosu" class="school-logo" />
      <div class="brand-text">
        <span class="brand-name">Aziz Sancar Anadolu Lisesi</span>
        <span class="brand-sub">E-Dergi Kütüphanesi</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="themeToggle" title="Karanlık/Aydınlık mod" aria-label="Temayı değiştir">🌙</button>
    </div>
  </header>

  <!-- İstatistik şeridi -->
  <div class="stats-bar" id="statsBar">
    <span>📖 <strong id="statCount">—</strong> dergi</span>
    <span>📅 <strong id="statYears">—</strong></span>
    <span>🏫 Tekirdağ / Kapaklı</span>
  </div>

  <!-- Hata banner -->
  <div class="error-banner" id="errorBanner">
    Dergiler yüklenirken bir hata oluştu. Sayfayı yenileyin.
  </div>

  <!-- Filtre çubuğu -->
  <div class="filter-bar">
    <label for="filterYear">Yıl:</label>
    <select class="filter-select" id="filterYear">
      <option value="">Tümü</option>
    </select>

    <label for="filterTerm">Dönem:</label>
    <select class="filter-select" id="filterTerm">
      <option value="">Tümü</option>
      <option value="Güz">Güz</option>
      <option value="Bahar">Bahar</option>
      <option value="Yaz">Yaz</option>
      <option value="Yıllık">Yıllık</option>
    </select>

    <button class="filter-reset" id="filterReset">✕ Sıfırla</button>
  </div>

  <!-- Galeri -->
  <main class="gallery-container" role="main">
    <div class="gallery-grid" id="galleryGrid">
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <span>© Aziz Sancar Anadolu Lisesi</span>
    <a href="https://azizsancaranadolu.meb.k12.tr" target="_blank" rel="noopener">Okul Web Sitesi →</a>
  </footer>

  <script src="/js/gallery.js"></script>
</body>
</html>

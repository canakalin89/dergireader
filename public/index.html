<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Dergi Kütüphanesi — Aziz Sancar Anadolu Lisesi</title>
  <meta name="description" content="Okulumuzun dijital dergi arşivi" />
  <meta name="theme-color" content="#0e1f5c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css?v=10" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">
        <img src="/img/logo.png" alt="Aziz Sancar Anadolu Lisesi" class="brand-logo" />
        <div class="brand-text">
          <span class="brand-name">Aziz Sancar Anadolu Lisesi</span>
          <span class="brand-sub">E-Dergi Kütüphanesi</span>
        </div>
      </a>
      <div class="header-right">
        <div class="stats-bar" id="statsBar">
          <span><strong id="statCount">—</strong> yayın</span>
          <span class="sep">·</span>
          <span id="statYears">—</span>
          <span class="sep sep3">·</span>
          <span id="statExtra">arşivde</span>
        </div>
        <button class="theme-btn" id="themeToggle" aria-label="Temayı değiştir">🌙</button>
        <a class="register-link" href="/admin/?register=1" id="registerLink">Kayıt Ol</a>
        <a class="admin-link" href="/admin/" id="adminLink" style="display:none">Yönetim</a>
      </div>
    </div>
  </header>

  <div class="error-banner" id="errorBanner">
    ⚠ Dergiler yüklenirken hata oluştu. Sayfayı yenileyin.
  </div>

  <div class="filter-row">
    <div class="filter-inner">
      <span class="filter-label">Filtrele</span>
      <select class="filter-select" id="filterYear" aria-label="Yıla göre filtrele">
        <option value="">Tüm yıllar</option>
      </select>
      <button class="filter-reset" id="filterReset">✕</button>
    </div>
  </div>

  <div class="category-filter-bar" id="categoryFilter" style="display:none"></div>

  <main class="gallery-container" role="main">
    <div class="gallery-grid" id="galleryGrid">
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
      <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-text"></div><div class="skeleton-text short"></div></div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span id="yr"></span> Aziz Sancar Anadolu Lisesi</span>
    <span class="footer-sep">·</span>
    <a href="https://azizsancaranadolu.meb.k12.tr" target="_blank" rel="noopener">Okul Web Sitesi →</a>
  </footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
  <script src="/js/gallery.js?v=12"></script>
</body>
</html>
